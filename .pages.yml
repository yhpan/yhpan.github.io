media:
  input: images
  output: /images

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: add {name}"
      update: "content: update {name}"
      delete: "content: remove {name}"

content:
  - name: profile
    label: Author profile
    type: file
    path: _data/profile.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: avatar
        label: Profile photo
        type: image
      - name: name
        label: Display name
        type: string
        required: true
      - name: pronouns
        label: Pronouns
        type: string
      - name: bio
        label: Short bio
        type: text
      - name: location
        type: string
      - name: employer
        type: string
      - name: uri
        label: Personal website
        type: string
      - name: email
        type: string
      - name: googlescholar
        label: Google Scholar URL
        type: string
      - name: orcid
        label: ORCID URL
        type: string
      - name: researchgate
        label: ResearchGate URL
        type: string
      - name: semantic
        label: Semantic Scholar URL
        type: string
      - name: github
        label: GitHub username
        type: string
      - name: linkedin
        label: LinkedIn username
        type: string
      - name: twitter
        label: X / Twitter username
        type: string
      - name: zhihu
        label: Zhihu username
        type: string

  - name: site-settings
    label: Site settings
    type: file
    path: _config.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: title
        label: Browser title
        type: string
        required: true
      - name: name
        label: Site name
        type: string
        required: true
      - name: description
        label: Search description
        type: text
      - name: url
        label: Website URL
        type: string
        required: true
      - name: locale
        label: Language locale
        type: string

  - name: navigation
    label: Main navigation
    type: file
    path: _data/navigation.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: main
        label: Menu links
        type: object
        list: true
        fields:
          - name: title
            label: Link label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true

  - name: page-introductions
    label: Page introductions
    type: file
    path: _data/page_text.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: notes_intro
        label: Notes introduction
        type: text
      - name: jobs_intro
        label: Jobs introduction
        type: text

  - name: jobs
    label: Job opportunities
    type: collection
    path: _jobs
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: [".gitkeep"]
    view:
      primary: title
      fields: [title, position, institution, location, deadline]
      sort: [deadline, title, position]
      search: [title, institution, location]
      default:
        sort: deadline
        order: asc
    fields:
      - name: title
        label: Job title
        type: string
        required: true
      - name: position
        label: Position type
        type: select
        required: true
        options:
          values: [Postdoc, PhD, Faculty, Engineer, Internship, Other]
      - name: location
        label: Job location
        type: string
      - name: institution
        label: Institution
        type: string
      - name: deadline
        label: Deadline
        type: date
        description: Leave empty when there is no fixed deadline.
      - name: apply_url
        label: Application link
        type: string
      - name: source_url
        label: Source link
        type: string
      - name: featured
        label: Featured
        type: boolean
      - name: body
        label: Notes
        type: rich-text

  - name: homepage
    label: Homepage
    type: file
    path: _pages/about.md
    format: yaml-frontmatter
    operations:
      delete: false
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: body
        label: Homepage content
        type: rich-text

  - name: research-page
    label: Research page
    type: file
    path: _pages/research.md
    format: yaml-frontmatter
    operations:
      delete: false
    fields:
      - name: title
        type: string
        required: true
      - name: body
        label: Research content
        type: rich-text

  - name: projects-page
    label: Projects page
    type: file
    path: _pages/projects.md
    format: yaml-frontmatter
    operations:
      delete: false
    fields:
      - name: title
        type: string
        required: true
      - name: body
        label: Projects content
        type: rich-text

  - name: publications
    label: Publications
    type: collection
    path: _publications
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    exclude: [".gitkeep"]
    view:
      primary: title
      fields: [title, category, date, venue]
      sort: [date, title]
      search: [title, venue, citation]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: category
        type: select
        required: true
        options:
          values:
            - name: manuscripts
              label: Journal Article
            - name: conferences
              label: Conference Paper
            - name: software
              label: Research Software
      - name: date
        type: date
      - name: venue
        type: string
      - name: excerpt
        type: text
      - name: paperurl
        label: Paper URL
        type: string
      - name: citation
        type: text
      - name: body
        label: Abstract or notes
        type: rich-text

  - name: notes
    label: New research notes
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename:
      template: "{date}-{primary}.md"
      field: create
    exclude: [".gitkeep"]
    view:
      primary: title
      fields: [title, date, tags]
      sort: [date, title]
      search: [title, tags, body]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: date
        type: date
        required: true
      - name: excerpt
        type: text
      - name: tags
        label: Tags
        type: string
        list: true
        description: Add one or more tags for browsing and aggregation.
      - name: published
        label: Published
        type: boolean
        default: true
      - name: body
        type: rich-text
